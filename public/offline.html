<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0891b2" />
    <title>Offline — 4292 Falcons</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
        background: #ffffff;
        color: #111111;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
      p { font-size: 1rem; color: #6b6b6b; line-height: 1.5; max-width: 20rem; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.75rem 1.25rem;
        background: #111111;
        color: #ffffff;
        text-decoration: none;
        font-size: 1rem;
        border-radius: 0.375rem;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>Your shopping list is still available. Other pages need a connection.</p>
      <a href="/dashboard/shopping">Open Shopping List</a>
    </div>
  </body>
</html>
